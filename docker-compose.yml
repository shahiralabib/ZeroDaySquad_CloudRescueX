services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./cloudrescue.db
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SEED_DEMO_DATA: "true"
      PORT: 8000
    volumes:
      - ./backend:/app
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
